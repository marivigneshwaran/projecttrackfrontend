<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customers - ProjectTrack</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <a href="index.html" class="navbar-brand">📋 ProjectTrack</a>
                
                <ul class="navbar-nav">
                    <li><a href="index.html" class="nav-link">Dashboard</a></li>
                    <li><a href="customers.html" class="nav-link active">Customers</a></li>
                    <li><a href="projects.html" class="nav-link">Projects</a></li>
                    <li><a href="tasks.html" class="nav-link">Tasks</a></li>
                </ul>

                <div class="navbar-actions">
                    <div class="user-info" id="user-info">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div>
                            <div style="font-weight: 500; font-size: 14px;" id="user-name">User</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" id="logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard">
        <div class="container">
            <div class="page-header">
                <div>
                    <h1>Customers</h1>
                    <p style="color: var(--gray-500); margin-top: 4px;">Manage all your customers.</p>
                </div>
                <button class="btn btn-primary" onclick="openModal('customer-modal')">+ Add Customer</button>
            </div>

            <!-- Customers Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Customer Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="customers-table">
                        <tr>
                            <td colspan="6" style="text-align: center; padding: 40px;">
                                <div class="spinner"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Customer Modal -->
    <div class="modal" id="customer-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Customer</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="customer-form">
                    <input type="hidden" name="id" id="customer-id">
                    
                    <div class="form-group">
                        <label class="form-label">Customer Name *</label>
                        <input type="text" name="name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Phone *</label>
                        <input type="tel" name="phone" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Address *</label>
                        <textarea name="address" class="form-textarea" required></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select name="active_status" class="form-select">
                            <option value="active">Active</option>
                            <option value="inactive">Inactive</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('customer-modal')">Cancel</button>
                <button type="submit" form="customer-form" class="btn btn-primary">Save Customer</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        let customers = [];

        async function loadCustomers() {
            try {
                customers = await api.getCustomers();
                renderCustomersTable();
            } catch (error) {
                console.error('Error loading customers:', error);
                showNotification('Failed to load customers', 'error');
            }
        }

        function renderCustomersTable() {
            const table = document.getElementById('customers-table');

            if (customers.length === 0) {
                table.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px; color: var(--gray-500);">No customers found</td></tr>';
                return;
            }

            table.innerHTML = customers.map(customer => `
                <tr>
                    <td><strong>${customer.name}</strong></td>
                    <td>${customer.email}</td>
                    <td>${customer.phone}</td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis;">${customer.address}</td>
                    <td>
                        <span class="status-badge ${customer.active_status === 'active' ? 'status-inprogress' : 'status-drop'}">
                            ${capitalizeFirst(customer.active_status)}
                        </span>
                    </td>
                    <td>
                        <div class="table-actions">
                            <button class="btn btn-primary btn-sm" onclick="editCustomer(${customer.id})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteCustomer(${customer.id})">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function editCustomer(id) {
            const customer = customers.find(c => c.id === id);
            if (!customer) return;

            document.getElementById('customer-id').value = id;
            document.getElementById('modal-title').textContent = 'Edit Customer';
            document.querySelector('input[name="name"]').value = customer.name;
            document.querySelector('input[name="email"]').value = customer.email;
            document.querySelector('input[name="phone"]').value = customer.phone;
            document.querySelector('textarea[name="address"]').value = customer.address;
            document.querySelector('select[name="active_status"]').value = customer.active_status;

            openModal('customer-modal');
        }

        async function deleteCustomer(id) {
            if (confirm('Are you sure you want to delete this customer?')) {
                try {
                    await api.deleteCustomer(id);
                    showNotification('Customer deleted successfully', 'success');
                    loadCustomers();
                } catch (error) {
                    showNotification('Failed to delete customer', 'error');
                }
            }
        }

        // Form submission
        document.getElementById('customer-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const id = document.getElementById('customer-id').value;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            // Validation
            const errors = validateForm(data, ['name', 'email', 'phone', 'address']);
            if (Object.keys(errors).length > 0) {
                displayFormErrors(errors, form);
                return;
            }

            try {
                if (id) {
                    await api.updateCustomer(id, data);
                    showNotification('Customer updated successfully', 'success');
                } else {
                    await api.createCustomer(data);
                    showNotification('Customer created successfully', 'success');
                }
                
                closeModal('customer-modal');
                resetForm('customer-form');
                document.getElementById('customer-id').value = '';
                document.getElementById('modal-title').textContent = 'Add Customer';
                loadCustomers();
            } catch (error) {
                showNotification(error.message || 'Failed to save customer', 'error');
            }
        });

        loadCustomers();
    </script>
</body>
</html>
