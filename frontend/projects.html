<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - ProjectTrack</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-content">
                <a href="index.html" class="navbar-brand">📋 ProjectTrack</a>
                
                <ul class="navbar-nav">
                    <li><a href="index.html" class="nav-link">Dashboard</a></li>
                    <li><a href="customers.html" class="nav-link">Customers</a></li>
                    <li><a href="projects.html" class="nav-link active">Projects</a></li>
                    <li><a href="tasks.html" class="nav-link">Tasks</a></li>
                </ul>

                <div class="navbar-actions">
                    <div class="user-info" id="user-info">
                        <div class="user-avatar" id="user-avatar">?</div>
                        <div>
                            <div style="font-weight: 500; font-size: 14px;" id="user-name">User</div>
                        </div>
                    </div>
                    <button class="btn btn-secondary btn-sm" id="logout-btn">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="dashboard">
        <div class="container">
            <div class="page-header">
                <div>
                    <h1>Projects</h1>
                    <p style="color: var(--gray-500); margin-top: 4px;">Manage all your projects.</p>
                </div>
                <button class="btn btn-primary" onclick="openModal('project-modal')">+ Add Project</button>
            </div>

            <!-- Projects Table -->
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Project Name</th>
                            <th>Client</th>
                            <th>Type</th>
                            <th>Status</th>
                            <th>Progress</th>
                            <th>Dates</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table">
                        <tr>
                            <td colspan="7" style="text-align: center; padding: 40px;">
                                <div class="spinner"></div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Project Modal -->
    <div class="modal" id="project-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Project</h2>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <form id="project-form">
                    <input type="hidden" name="id" id="project-id">
                    
                    <div class="form-group">
                        <label class="form-label">Project Name *</label>
                        <input type="text" name="project_name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Client *</label>
                        <select name="client" class="form-select" required id="client-select">
                            <option value="">Select a client</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Project Type</label>
                        <select name="project_type" class="form-select">
                            <option value="internal">Internal</option>
                            <option value="external">External</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Start Date *</label>
                        <input type="date" name="start_date" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Due Date *</label>
                        <input type="date" name="due_date" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="inprogress">In Progress</option>
                            <option value="completed">Completed</option>
                            <option value="drop">Drop</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Progress (%)</label>
                        <input type="number" name="progress_percent" class="form-input" min="0" max="100" value="0">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('project-modal')">Cancel</button>
                <button type="submit" form="project-form" class="btn btn-primary">Save Project</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
    <script>
        let projects = [];
        let customers = [];

        async function loadData() {
            try {
                customers = await api.getCustomers();
                projects = await api.getProjects();
                
                populateCustomersSelect();
                renderProjectsTable();
            } catch (error) {
                console.error('Error loading data:', error);
                showNotification('Failed to load data', 'error');
            }
        }

        function populateCustomersSelect() {
            const select = document.getElementById('client-select');
            customers.forEach(customer => {
                const option = document.createElement('option');
                option.value = customer.id;
                option.textContent = customer.name;
                select.appendChild(option);
            });
        }

        function renderProjectsTable() {
            const table = document.getElementById('projects-table');

            if (projects.length === 0) {
                table.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--gray-500);">No projects found</td></tr>';
                return;
            }

            table.innerHTML = projects.map(project => {
                const client = customers.find(c => c.id === project.client);
                return `
                    <tr>
                        <td><strong>${project.project_name}</strong></td>
                        <td>${client ? client.name : 'Unknown'}</td>
                        <td>
                            <span style="text-transform: capitalize;">
                                ${project.project_type === 'internal' ? '🏢' : '👥'} ${project.project_type}
                            </span>
                        </td>
                        <td>
                            <span class="status-badge ${getStatusBadgeClass(project.status)}">
                                ${capitalizeFirst(project.status)}
                            </span>
                        </td>
                        <td>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${project.progress_percent}%"></div>
                            </div>
                            <small style="color: var(--gray-500);">${project.progress_percent}%</small>
                        </td>
                        <td>
                            <small>${formatDate(project.start_date)}</small><br>
                            <small>${formatDate(project.due_date)}</small>
                        </td>
                        <td>
                            <div class="table-actions">
                                <button class="btn btn-primary btn-sm" onclick="editProject(${project.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteProject(${project.id})">Delete</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function editProject(id) {
            const project = projects.find(p => p.id === id);
            if (!project) return;

            document.getElementById('project-id').value = id;
            document.getElementById('modal-title').textContent = 'Edit Project';
            document.querySelector('input[name="project_name"]').value = project.project_name;
            document.querySelector('select[name="client"]').value = project.client;
            document.querySelector('select[name="project_type"]').value = project.project_type;
            document.querySelector('input[name="start_date"]').value = project.start_date;
            document.querySelector('input[name="due_date"]').value = project.due_date;
            document.querySelector('select[name="status"]').value = project.status;
            document.querySelector('input[name="progress_percent"]').value = project.progress_percent;

            openModal('project-modal');
        }

        async function deleteProject(id) {
            if (confirm('Are you sure you want to delete this project?')) {
                try {
                    await api.deleteProject(id);
                    showNotification('Project deleted successfully', 'success');
                    loadData();
                } catch (error) {
                    showNotification('Failed to delete project', 'error');
                }
            }
        }

        // Form submission
        document.getElementById('project-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const form = e.target;
            const id = document.getElementById('project-id').value;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            // Validation
            const errors = validateForm(data, ['project_name', 'client', 'start_date', 'due_date']);
            if (Object.keys(errors).length > 0) {
                displayFormErrors(errors, form);
                return;
            }

            try {
                if (id) {
                    await api.updateProject(id, data);
                    showNotification('Project updated successfully', 'success');
                } else {
                    await api.createProject(data);
                    showNotification('Project created successfully', 'success');
                }
                
                closeModal('project-modal');
                resetForm('project-form');
                document.getElementById('project-id').value = '';
                document.getElementById('modal-title').textContent = 'Add Project';
                loadData();
            } catch (error) {
                showNotification(error.message || 'Failed to save project', 'error');
            }
        });

        loadData();
    </script>
</body>
</html>
